<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastORM Builder</title>
    <script src="react.production.min.js"></script>
    <script src="react-dom.production.min.js"></script>
        <style>
        :root {
            --bg: #2b2d30;
            --surface: #3c3f41;
            --surface2: #45484a;
            --border: #4e5157;
            --text: #bbb;
            --bright: #e8e8e8;
            --accent: #6366f1;
            --accent-h: #818cf8;
            --success: #4ade80;
            --danger: #f87171;
            --warn: #fbbf24
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            font-size: 13px;
            height: 100vh;
            overflow: hidden
        }

        #root {
            height: 100%;
            display: flex;
            flex-direction: column
        }

        button {
            cursor: pointer;
            font-size: 12px;
            border: none;
            border-radius: 4px;
            padding: 5px 10px
        }

        input, select {
            padding: 5px 8px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--bright);
            font-size: 12px;
            width: 100%
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent)
        }

        label {
            display: block;
            font-size: 11px;
            color: var(--text);
            margin-bottom: 3px
        }

        .btn {
            background: var(--accent);
            color: #fff
        }

        .btn:hover {
            background: var(--accent-h)
        }

        .btn-s {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text)
        }

        .btn-s:hover {
            background: var(--border)
        }

        .btn-d {
            background: var(--danger);
            color: #fff
        }

        .header {
            display: flex;
            align-items: center;
            padding: 6px 12px;
            background: var(--surface);
            border-bottom: 1px solid var(--border)
        }

        .header h1 {
            font-size: 13px;
            font-weight: 600;
            color: var(--bright);
            flex: 1
        }

        .tabs {
            display: flex;
            background: var(--surface);
            border-bottom: 1px solid var(--border)
        }

        .tab {
            padding: 7px 14px;
            color: var(--text);
            border-bottom: 2px solid transparent;
            font-size: 12px;
            cursor: pointer;
            user-select: none
        }

        .tab:hover {
            color: var(--bright)
        }

        .tab.active {
            color: var(--bright);
            border-bottom-color: var(--accent)
        }

        .content {
            flex: 1;
            overflow: auto;
            padding: 12px;
            display: flex;
            flex-direction: column
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 10px
        }

        .card h3 {
            font-size: 12px;
            color: var(--bright);
            margin-bottom: 8px;
            font-weight: 600
        }

        .row {
            display: flex;
            gap: 8px
        }

        .row > * {
            flex: 1
        }

        .fg {
            margin-bottom: 8px
        }

        .conn-item {
            display: flex;
            align-items: center;
            padding: 8px;
            border-radius: 4px;
            cursor: pointer;
            gap: 8px;
            min-height: 36px
        }

        .conn-item:hover {
            background: rgba(99, 102, 241, .1)
        }

        .conn-item.active {
            border-left: 3px solid var(--accent);
            background: rgba(99, 102, 241, .08)
        }

        .conn-item .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%
        }

        .conn-item .dot.on {
            background: var(--success)
        }

        .conn-item .dot.off {
            background: var(--danger)
        }

        .conn-item .name {
            flex: 1;
            color: var(--bright);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }

        .db-icon svg {
            width: 100%;
            height: 100%;
            display: block
        }

        .conn-item .type {
            font-size: 11px
        }

        .tree-item {
            padding: 4px 8px;
            border-radius: 3px;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer
        }

        .tree-item:hover {
            background: rgba(99, 102, 241, .08)
        }

        .tree-item.l1 {
            padding-left: 16px
        }

        .tree-item.l2 {
            padding-left: 32px
        }

        .tree-item input {
            margin: 0
        }

        .status {
            padding: 4px 12px;
            background: var(--surface);
            border-top: 1px solid var(--border);
            font-size: 11px;
            display: flex;
            justify-content: space-between
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: var(--text)
        }

        .empty .ico {
            font-size: 28px;
            margin-bottom: 6px
        }

        .modal-bg {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100
        }

        .modal {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            width: 420px;
            max-height: 80vh;
            overflow-y: auto
        }

        .modal h2 {
            font-size: 14px;
            color: var(--bright);
            margin-bottom: 12px
        }

        .modal-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            margin-top: 12px
        }

        .check {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 6px
        }

        .check input {
            width: auto
        }

        .sep {
            height: 1px;
            background: var(--border);
            margin: 10px 0
        }

        .sub-tabs {
            display: flex;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px 6px 0 0;
            overflow: hidden
        }

        .sub-tab {
            padding: 7px 14px;
            font-size: 12px;
            cursor: pointer;
            color: var(--text);
            border-bottom: 2px solid transparent;
            flex: 1;
            text-align: center;
            user-select: none
        }

        .sub-tab:hover {
            color: var(--bright)
        }

        .sub-tab.active {
            color: var(--bright);
            background: var(--surface2);
            border-bottom-color: var(--accent)
        }

        .sub-content {
            flex: 1;
            overflow-y: auto;
            border: 1px solid var(--border);
            border-top: none;
            border-radius: 0 0 6px 6px;
            padding: 10px;
            background: var(--surface)
        }

        .schema-group {
            margin-bottom: 8px
        }

        .schema-header {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 5px 8px;
            font-size: 12px;
            color: var(--bright);
            background: var(--bg);
            border-radius: 4px;
            margin-bottom: 4px;
            cursor: pointer;
            user-select: none
        }

        .schema-header:hover {
            background: rgba(99, 102, 241, .08)
        }

        .fold-icon {
            font-size: 9px;
            color: var(--text);
            width: 12px
        }

        .schema-count {
            margin-left: auto;
            font-size: 11px;
            color: var(--text);
            font-weight: normal
        }

        .table-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 8px 4px 24px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px
        }

        .table-row:hover {
            background: rgba(99, 102, 241, .08)
        }

        .table-row input[type=checkbox] {
            width: auto;
            margin: 0
        }

        .table-name {
            color: var(--bright)
        }

        .table-comment {
            font-size: 11px;
            color: var(--text);
            margin-left: auto
        }

        .output-form {
            padding: 4px 0
        }

        .pkg-history {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 4px
        }

        .pkg-chip {
            background: rgba(99, 102, 241, .15);
            color: var(--accent-h);
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 10px;
            cursor: pointer;
            border: 1px solid rgba(99, 102, 241, .3)
        }

        .pkg-chip:hover {
            background: rgba(99, 102, 241, .3)
        }
    </style>
</head>
<body>
<div id="root"></div>
<script src="app.compiled.js"></script>
</body>
</html>
