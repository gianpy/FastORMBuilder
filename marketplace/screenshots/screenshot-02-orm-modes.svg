<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400">
  <rect width="900" height="400" fill="#2b2d30"/>
  <rect width="900" height="28" fill="#1e1f22"/>
  <text x="450" y="18" text-anchor="middle" fill="#bbb" font-family="monospace" font-size="11">FastBuilder — Choose ORM Framework</text>
  <text x="50" y="70" fill="#ddd" font-family="sans-serif" font-size="14" font-weight="bold">Select ORM Framework</text>
  <rect x="50" y="90" width="120" height="40" rx="6" fill="#3574f0"/>
  <text x="110" y="115" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="13" font-weight="bold">MyBatis</text>
  <rect x="180" y="90" width="80" height="40" rx="6" fill="#393b40" stroke="#555" stroke-width="1"/>
  <text x="220" y="115" text-anchor="middle" fill="#bbb" font-family="sans-serif" font-size="13">JPA</text>
  <rect x="270" y="90" width="110" height="40" rx="6" fill="#393b40" stroke="#555" stroke-width="1"/>
  <text x="325" y="115" text-anchor="middle" fill="#bbb" font-family="sans-serif" font-size="13">Hibernate</text>
  <rect x="390" y="90" width="80" height="40" rx="6" fill="#393b40" stroke="#555" stroke-width="1"/>
  <text x="430" y="115" text-anchor="middle" fill="#bbb" font-family="sans-serif" font-size="13">YORM</text>
  <rect x="50" y="150" width="800" height="1" fill="#393b40"/>
  <rect x="50" y="170" width="380" height="200" rx="6" fill="#1e1f22"/>
  <text x="70" y="198" fill="#6ba5ff" font-family="sans-serif" font-size="12" font-weight="bold">MyBatis — Full Generator</text>
  <text x="70" y="222" fill="#aaa" font-family="sans-serif" font-size="11">• Model classes + Mapper interfaces</text>
  <text x="70" y="244" fill="#aaa" font-family="sans-serif" font-size="11">• XML mapper files with SQL</text>
  <text x="70" y="266" fill="#aaa" font-family="sans-serif" font-size="11">• Dynamic SQL support</text>
  <text x="70" y="288" fill="#aaa" font-family="sans-serif" font-size="11">• Smart merge existing files</text>
  <text x="70" y="310" fill="#aaa" font-family="sans-serif" font-size="11">• Lombok + custom annotations</text>
  <rect x="470" y="170" width="380" height="200" rx="6" fill="#1e1f22"/>
  <text x="490" y="198" fill="#6ba5ff" font-family="sans-serif" font-size="12" font-weight="bold">JPA — Entity Classes</text>
  <text x="490" y="222" fill="#aaa" font-family="sans-serif" font-size="11">• @Entity + @Table annotations</text>
  <text x="490" y="244" fill="#aaa" font-family="sans-serif" font-size="11">• @Column with constraints</text>
  <text x="490" y="266" fill="#aaa" font-family="sans-serif" font-size="11">• @ManyToOne / @OneToMany</text>
  <text x="490" y="288" fill="#aaa" font-family="sans-serif" font-size="11">• GenerationType strategies</text>
  <text x="490" y="310" fill="#aaa" font-family="sans-serif" font-size="11">• Lombok @Data support</text>
